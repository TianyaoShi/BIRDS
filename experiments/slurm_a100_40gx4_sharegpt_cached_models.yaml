run:
  run_id: a100-40gx4-sharegpt-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-sharegpt-cached-models-000
  default_endpoint: /v1/chat/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  time: 02:30:00
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  array_concurrency_limit: 3
  base_port: 9300
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 8192
  max_num_seqs: 256
  max_num_batched_tokens: 4096
  readiness_timeout_s: 1800
search:
  search_mode: hybrid
  trial_min_duration_s: 150
  trial_max_duration_s: 300
  final_confirmation_duration_s: 300
  rate_precision: 0.05
  initial_request_rate: 1
  max_request_rate: 12
  max_binary_steps: 9
  max_bracket_trials: 14
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 128
  closed_loop_plateau_relative_gain: 0.05
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 1000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  max_num_seqs: 256
  max_num_batched_tokens: 4096
overrides:
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
  reason: Small models can explore a higher ShareGPT request-rate ceiling on one A100.
  launch:
    max_num_seqs: 512
    max_num_batched_tokens: 8192
  search:
    initial_request_rate: 5
    max_request_rate: 80
    max_binary_steps: 12
    max_bracket_trials: 18
    ttft_slo_ms: 500
    tpot_slo_ms: 100
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
  reason: 3B/4B class should fit comfortably at TP1 with a moderate ceiling.
  search:
    initial_request_rate: 3
    max_request_rate: 50
    max_binary_steps: 11
    max_bracket_trials: 16
    ttft_slo_ms: 750
    tpot_slo_ms: 125
- match:
    models:
    - Qwen/Qwen3-8B
    - meta-llama/Llama-2-7b-chat-hf
    - meta-llama/Llama-3.1-8B-Instruct
  reason: 7B/8B class remains practical at TP1 on 40GB A100 with the 8192-token cap.
  search:
    initial_request_rate: 2
    max_request_rate: 24
    max_binary_steps: 10
    max_bracket_trials: 14
- match:
    models:
    - Qwen/Qwen3-14B
    - meta-llama/Llama-2-13b-chat-hf
  reason: 13B/14B dense class has less KV-cache headroom on 40GB cards.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 1
    max_request_rate: 16
    max_binary_steps: 9
    max_bracket_trials: 12
- match:
    model: openai/gpt-oss-20b
  reason: gpt-oss-20b uses quantized checkpoint metadata; let vLLM choose dtype.
  launch:
    dtype: auto
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 3
    max_request_rate: 36
    max_binary_steps: 10
    max_bracket_trials: 16
- match:
    model: openai/gpt-oss-120b
  reason: gpt-oss-120b uses quantized checkpoint metadata; run only at TP4 on A100-40GB with conservative batching.
  launch:
    dtype: auto
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 9
    max_bracket_trials: 12
- match:
    models:
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-30B-A3B-Thinking-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
  reason: 26B-34B class needs TP2/TP4 on 40GB A100; keep the search envelope conservative.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 9
    max_bracket_trials: 12
- match:
    models:
    - meta-llama/Llama-2-7b-chat-hf
    - meta-llama/Llama-2-13b-chat-hf
  reason: Llama-2 model configs derive a 4096-token maximum context.
  launch:
    max_model_len: 4096
experiments:
- id: qwen3-0-6b-a100-tp1
  model: Qwen/Qwen3-0.6B
  workload: ./workloads/live_sharegpt_workload_context_8192.yaml
- id: qwen3-1-7b-a100-tp1
