run:
  run_id: single-gpu-model-loop-run-longbench-no-llama2-000
  output_root: ../results/orchestrator
  allowed_gpu_ids: [0, 1]
  max_active_gpus: 2
  keep_one_gpu_spare: false
  default_endpoint: /v1/chat/completions
  base_port_start: 8300
  base_port_end: 8399
  metrics_port_offset: 1000
  python_executable: /local/scratch/a/shi676/.venv/bin/python

hardware:
  name: l40-48gb
  gpu_memory_gb: 48
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768

search:
  search_mode: hybrid
  trial_min_duration_s: 300
  trial_max_duration_s: 600
  final_confirmation_duration_s: 600
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 2000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 256
  max_num_batched_tokens: 2048

overrides:
  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
    reason: Small models can explore a wider rate ceiling even on prefill-heavy LongBench prompts.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 0.5
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 1000
      tpot_slo_ms: 50

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
    reason: Mid-size models use a moderate LongBench search envelope.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 1500
      tpot_slo_ms: 100

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
    reason: Larger models keep a lower LongBench ceiling to avoid wasted bracket trials.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14

  - match:
      model: openai/gpt-oss-20b
    reason: gpt-oss-20b uses the cached mxfp4 checkpoint; let vLLM pick dtype automatically.
    launch:
      dtype: auto
    search:
      initial_request_rate: 0.5
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16

experiments:
  - id: single-gpu-model-loop-longbench-no-llama2
    models:
      - Qwen/Qwen3-0.6B
      - Qwen/Qwen3-1.7B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E2B-it
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
      - openai/gpt-oss-20b
    workloads:
      - ./workloads/longbench_all_truncated.yaml
