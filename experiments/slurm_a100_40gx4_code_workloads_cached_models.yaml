run:
  run_id: a100-40gx4-code-workloads-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-code-workloads-cached-models-000
  default_endpoint: /v1/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  time: 06:00:00
  array_concurrency_limit: 3
  base_port: 9600
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 32768
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 32768
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1800
search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 5000
  tpot_slo_ms: 75
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048
overrides:
- match:
    workloads:
    - '*crosscodeeval*'
  reason: CrossCodeEval has moderate prompts and tiny completions; keep an interactive code-completion TTFT target.
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 9
    max_bracket_trials: 14
    ttft_slo_ms: 1500
    tpot_slo_ms: 75
- match:
    workloads:
    - '*repobench*'
  reason: RepoBench has long retrieved-code prompts but short completions.
  search:
    initial_request_rate: 0.25
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 5000
    tpot_slo_ms: 75
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: Small A100 models can use a wider CrossCodeEval envelope.
  launch:
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 2
    max_request_rate: 64
    max_binary_steps: 11
    max_bracket_trials: 18
    ttft_slo_ms: 500
    tpot_slo_ms: 40
    max_closed_loop_concurrency: 192
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: 3B/4B A100 code-completion models keep an interactive latency target.
  search:
    initial_request_rate: 1
    max_request_rate: 24
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 750
    tpot_slo_ms: 50
- match:
    models:
    - Qwen/Qwen3-8B
    - meta-llama/Llama-3.1-8B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: 8B A100 code-completion models at full workload context.
  search:
    initial_request_rate: 0.5
    max_request_rate: 10
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 1500
    tpot_slo_ms: 75
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
    workloads:
    - '*repobench*'
  reason: Small A100 RepoBench runs can probe a wider envelope.
  launch:
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 5000
    tpot_slo_ms: 50
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
    workloads:
    - '*repobench*'
  reason: 3B/4B RepoBench runs keep the IDE-realistic latency envelope.
  search:
    initial_request_rate: 0.25
    max_request_rate: 6
    max_binary_steps: 9
    max_bracket_trials: 16
    ttft_slo_ms: 5000
    tpot_slo_ms: 50
- match:
    models:
    - Qwen/Qwen3-8B
    - meta-llama/Llama-3.1-8B-Instruct
    workloads:
    - '*repobench*'
  reason: 8B RepoBench runs keep lower ceilings at full workload context.
  search:
    initial_request_rate: 0.25
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 5000
    tpot_slo_ms: 75
- match:
    models:
    - Qwen/Qwen3-14B
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-30B-A3B-Thinking-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
    - openai/gpt-oss-120b
  reason: Large A100-40GB code runs use 8k workload and engine context for memory headroom.
  launch:
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
- match:
    model: openai/gpt-oss-120b
  reason: gpt-oss-120B uses quantized checkpoint metadata.
  launch:
    dtype: auto
    gpu_memory_utilization: 0.88
experiments:
- id: code-workloads-full-single-gpu
  models:
  - Qwen/Qwen3-0.6B
  - Qwen/Qwen3-1.7B
  - google/gemma-4-E2B-it
  - meta-llama/Llama-3.2-1B-Instruct
  - Qwen/Qwen3-4B-Instruct-2507
  - Qwen/Qwen3-4B-Thinking-2507
  - google/gemma-4-E4B-it
  - meta-llama/Llama-3.2-3B-Instruct
  - Qwen/Qwen3-8B
  - meta-llama/Llama-3.1-8B-Instruct
  workloads:
  - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
  - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
- id: code-workloads-qwen14-8k-tp1
  model: Qwen/Qwen3-14B
  workloads:
  - ./workloads/a100_crosscodeeval_rg1_unixcoder_cache_realistic_8k.yaml
  - ./workloads/a100_repobench_python_java_aggregate_cache_realistic_8k_drop.yaml
  launch:
    max_model_len: 8192
- id: code-workloads-30b-8k-tp2
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/a100_crosscodeeval_rg1_unixcoder_cache_realistic_8k.yaml
  - ./workloads/a100_repobench_python_java_aggregate_cache_realistic_8k_drop.yaml
  launch:
    gpu_count: 2
    tensor_parallel_size: 2
    max_model_len: 8192
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    readiness_timeout_s: 2400
- id: code-workloads-30b-8k-tp4
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/a100_crosscodeeval_rg1_unixcoder_cache_realistic_8k.yaml
  - ./workloads/a100_repobench_python_java_aggregate_cache_realistic_8k_drop.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
    max_model_len: 8192
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    readiness_timeout_s: 2400
- id: code-workloads-gpt-oss-120b-8k-tp4
  model: openai/gpt-oss-120b
  workloads:
  - ./workloads/a100_crosscodeeval_rg1_unixcoder_cache_realistic_8k.yaml
  - ./workloads/a100_repobench_python_java_aggregate_cache_realistic_8k_drop.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
    max_model_len: 8192
    gpu_memory_utilization: 0.88
    max_num_seqs: 128
    max_num_batched_tokens: 2048
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    readiness_timeout_s: 2400
