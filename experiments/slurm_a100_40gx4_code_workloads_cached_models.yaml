run:
  run_id: a100-40gx4-code-workloads-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-code-workloads-cached-models-000
  default_endpoint: /v1/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  time: 06:00:00
  array_concurrency_limit: 3
  base_port: 9600
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 8192
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1800
search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 5000
  tpot_slo_ms: 75
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048
overrides:
- match:
    workloads:
    - '*crosscodeeval*'
  reason: CrossCodeEval has moderate prompts and tiny completions; keep an interactive code-completion TTFT target.
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 9
    max_bracket_trials: 14
    ttft_slo_ms: 1500
    tpot_slo_ms: 75
- match:
    workloads:
    - '*repobench*'
  reason: RepoBench 8k-drop has long retrieved-code prompts but one-line completions; keep TTFT bounded to IDE-like latency.
  search:
    initial_request_rate: 0.25
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 5000
    tpot_slo_ms: 75
- match:
    model: openai/gpt-oss-120b
  reason: gpt-oss-120B uses quantized checkpoint metadata; keep A100 TP4 launch conservative.
  launch:
    dtype: auto
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: Single-GPU small models can use a wider CrossCodeEval request-rate envelope on A100.
  launch:
    max_num_seqs: 512
    max_num_batched_tokens: 8192
  search:
    initial_request_rate: 2
    max_request_rate: 64
    max_binary_steps: 11
    max_bracket_trials: 18
    ttft_slo_ms: 500
    tpot_slo_ms: 40
    max_closed_loop_concurrency: 192
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: Single-GPU 3B/4B models keep an interactive CrossCodeEval latency target.
  search:
    initial_request_rate: 1
    max_request_rate: 24
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 750
    tpot_slo_ms: 50
    max_closed_loop_concurrency: 128
- match:
    models:
    - Qwen/Qwen3-8B
    - Qwen/Qwen3-14B
    - meta-llama/Llama-3.1-8B-Instruct
    workloads:
    - '*crosscodeeval*'
  reason: Single-GPU 8B/14B models use a lower CrossCodeEval ceiling on A100-40GB.
  search:
    initial_request_rate: 0.5
    max_request_rate: 10
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 1500
    tpot_slo_ms: 75
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
    workloads:
    - '*repobench*'
  reason: Small A100 RepoBench runs can probe a wider 8k prompt envelope while keeping bounded batching.
  launch:
    max_num_seqs: 512
    max_num_batched_tokens: 8192
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 5000
    tpot_slo_ms: 50
    max_closed_loop_concurrency: 128
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
    workloads:
    - '*repobench*'
  reason: 3B/4B RepoBench runs keep the IDE-realistic latency envelope.
  search:
    initial_request_rate: 0.25
    max_request_rate: 6
    max_binary_steps: 9
    max_bracket_trials: 16
    ttft_slo_ms: 5000
    tpot_slo_ms: 50
    max_closed_loop_concurrency: 64
- match:
    models:
    - Qwen/Qwen3-8B
    - Qwen/Qwen3-14B
    - meta-llama/Llama-3.1-8B-Instruct
    workloads:
    - '*repobench*'
  reason: 8B/14B RepoBench runs get lower ceilings on A100-40GB.
  search:
    initial_request_rate: 0.25
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 14
    ttft_slo_ms: 5000
    tpot_slo_ms: 75
    max_closed_loop_concurrency: 64
- match:
    models:
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-30B-A3B-Thinking-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
    - '*crosscodeeval*'
  reason: A100 30B-class CrossCodeEval runs use TP2/TP4 with a conservative code-completion ceiling.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.25
    max_request_rate: 6
    max_binary_steps: 8
    max_bracket_trials: 12
- match:
    models:
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-30B-A3B-Thinking-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
    - '*repobench*'
  reason: A100 30B-class RepoBench combines long prompts with large models; keep the upper bound conservative.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.1
    max_request_rate: 2
    max_binary_steps: 8
    max_bracket_trials: 12
