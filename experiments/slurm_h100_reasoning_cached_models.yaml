run:
  run_id: h100-reasoning-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/h100-reasoning-cached-models-000
  default_endpoint: /v1/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python

slurm:
  partition: ai
  account: yiding
  qos: normal
  time: 04:00:00
  modules:
    - modtree/gpu
    - cuda/12.9.0
  setup_commands:
    - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 4
  base_port: 9700

hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-120b: 30.0

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  max_num_seqs: 256
  max_num_batched_tokens: 4096
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 360
  trial_max_duration_s: 720
  final_confirmation_duration_s: 900
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 8
  max_binary_steps: 9
  max_bracket_trials: 16
  open_loop_bracket_growth_factor: 1.5
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 30.0
  ttft_slo_ms: 2000
  tpot_slo_ms: 200
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: unique-then-cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 256
  max_num_batched_tokens: 4096

overrides:

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
    reason: 3B/4B non-thinking reasoning runs have short prompts and should probe well above L40 rates.
    search:
      initial_request_rate: 0.5
      max_request_rate: 24
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 1500
      tpot_slo_ms: 150
      max_closed_loop_concurrency: 96

  - match:
      models:
        - Qwen/Qwen3-4B-Thinking-2507
    reason: 4B thinking models can emit much longer traces than instruct variants; keep the ceiling lower while preserving an H100-sized search range.
    search:
      initial_request_rate: 0.5
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 1500
      tpot_slo_ms: 175
      max_closed_loop_concurrency: 64

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
        - openai/gpt-oss-20b
    reason: 8B/14B/gpt-oss-20B reasoning runs use short prompts but potentially long outputs.
    search:
      initial_request_rate: 0.5
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 16
      max_closed_loop_concurrency: 64

  - match:
      model: openai/gpt-oss-20b
    reason: gpt-oss-20B uses quantized checkpoint metadata; let vLLM pick dtype.
    launch:
      dtype: auto

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-32B
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
        - meta-llama/CodeLlama-34b-Instruct-hf
    reason: H100 ~30B reasoning models are decode-heavy but should not inherit the L40 conservative ceiling.
    search:
      initial_request_rate: 0.25
      max_request_rate: 10
      max_binary_steps: 9
      max_bracket_trials: 14
      max_closed_loop_concurrency: 48

  - match:
      model: Qwen/Qwen3-30B-A3B-Thinking-2507
    reason: 30B thinking reasoning runs may produce the longest outputs in this size class.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 14
      max_closed_loop_concurrency: 32

  - match:
      model: meta-llama/CodeLlama-34b-Instruct-hf
    reason: CodeLlama model configs derive a 16384-token maximum context; keep this family below the default 32768 context.
    launch:
      max_model_len: 16384

  - match:
      model: meta-llama/Llama-3.1-70B-Instruct
    reason: 70B reasoning at TP4 is decode-heavy; probe a moderate H100 ceiling.
    search:
      initial_request_rate: 0.1
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 12
      max_closed_loop_concurrency: 24

  - match:
      model: openai/gpt-oss-120b
    reason: gpt-oss-120B uses quantized checkpoint metadata; keep allocator fragmentation mitigation for H100 launch stability.
    launch:
      dtype: auto
      env:
        PYTORCH_ALLOC_CONF: expandable_segments:True
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    search:
      initial_request_rate: 0.1
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 12
      max_closed_loop_concurrency: 24

  - match:
      models:
        - Qwen/Qwen3-235B-A22B-Instruct-2507
        - Qwen/Qwen3-235B-A22B-Thinking-2507
    reason: Qwen3-235B-A22B is MoE and fast, but reasoning traces can be very long; use a broad full-node search with a long startup budget.
    launch:
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "4800"
      readiness_timeout_s: 5400
      max_num_seqs: 128
      max_num_batched_tokens: 2048
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 8
      max_bracket_trials: 12
      max_closed_loop_concurrency: 24

experiments:
  # Excluded from helper_scripts/hf_cached_models.txt:
  # - Llama-2 models, matching the no-Llama2 H100 experiment set.
  # - DeepSeek-V4 models, unsupported in the current vLLM environment.

  - id: reasoning-single-gpu
    models:
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
      - openai/gpt-oss-20b
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml

  - id: reasoning-30b-tp2
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2

  - id: reasoning-30b-tp4
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: reasoning-70b-tp4
    model: meta-llama/Llama-3.1-70B-Instruct
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: reasoning-gpt-oss-120b-tp1
    model: openai/gpt-oss-120b
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_memory_utilization: 0.95
      max_model_len: 8192
      max_num_seqs: 64
      max_num_batched_tokens: 1024

  - id: reasoning-gpt-oss-120b-tp2
    model: openai/gpt-oss-120b
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.85
      max_model_len: 8192
      max_num_seqs: 64
      max_num_batched_tokens: 1024

  - id: reasoning-gpt-oss-120b-tp4
    model: openai/gpt-oss-120b
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.90
      max_num_seqs: 128
      max_num_batched_tokens: 2048

  - id: reasoning-qwen3-235b-a22b-tp8
    models:
      - Qwen/Qwen3-235B-A22B-Instruct-2507
      - Qwen/Qwen3-235B-A22B-Thinking-2507
    workloads:
      - ./reasoning_workloads/mmlu_pro_reasoning/workload_yamls/shard_000.yaml
      - ./reasoning_workloads/supergpqa_hard_reasoning/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 8
      tensor_parallel_size: 8
