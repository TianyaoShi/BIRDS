run:
  run_id: h100-sharegpt-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/h100-sharegpt-cached-models-000
  default_endpoint: /v1/chat/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python

slurm:
  partition: ai
  account: yiding
  qos: normal
  time: 03:00:00
  modules:
    - modtree/gpu
    - cuda/12.9.0
  setup_commands:
    - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 1
  base_port: 9200

hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 1
  max_request_rate: 12
  max_binary_steps: 9
  max_bracket_trials: 16
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 128
  closed_loop_plateau_relative_gain: 0.05
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 1000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  max_num_seqs: 1024
  max_num_batched_tokens: 8192

overrides:
  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
    reason: H100 3B/4B class, excluding smaller models to avoid CPU-side scheduler caps dominating the search.
    search:
      initial_request_rate: 5
      max_request_rate: 100
      max_binary_steps: 12
      max_bracket_trials: 18
      ttft_slo_ms: 500
      tpot_slo_ms: 100

  - match:
      models:
        - Qwen/Qwen3-8B
        - meta-llama/Llama-2-7b-chat-hf
        - meta-llama/Llama-3.1-8B-Instruct
    reason: H100 7B/8B class; high enough to find the boundary without overemphasizing client or CPU scheduling limits.
    search:
      initial_request_rate: 3
      max_request_rate: 40
      max_binary_steps: 10
      max_bracket_trials: 16

  - match:
      model: openai/gpt-oss-20b
    reason: gpt-oss-20b uses cached MXFP4-style quantization; let vLLM choose dtype and allow a wider cap than dense 14B models.
    launch:
      dtype: auto
    search:
      initial_request_rate: 5
      max_request_rate: 50
      max_binary_steps: 10
      max_bracket_trials: 18

  - match:
      models:
        - Qwen/Qwen3-14B
        - meta-llama/Llama-2-13b-chat-hf
    reason: H100 13B/14B dense class.
    search:
      initial_request_rate: 2
      max_request_rate: 30
      max_binary_steps: 10
      max_bracket_trials: 14

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-30B-A3B-Thinking-2507
        - Qwen/Qwen3-32B
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
        - meta-llama/CodeLlama-34b-Instruct-hf
        - openai/gpt-oss-120b
    reason: H100 ~30B/gpt-oss-120b class, tested at TP1/TP2/TP4 with a conservative shared ceiling.
    search:
      initial_request_rate: 0.5
      max_request_rate: 40
      max_binary_steps: 10
      max_bracket_trials: 14

  - match:
      models:
        - meta-llama/Llama-2-70b-chat-hf
        - meta-llama/Llama-3.1-70B-Instruct
        - deepseek-ai/DeepSeek-V4-Flash
        - deepseek-ai/DeepSeek-V4-Flash-Base
    reason: 70B and DeepSeek-V4 class run at TP4 with a low ceiling to avoid wasting long ShareGPT trials.
    search:
      initial_request_rate: 0.25
      max_request_rate: 15
      max_binary_steps: 9
      max_bracket_trials: 12

  - match:
      models:
        - meta-llama/Llama-2-7b-chat-hf
        - meta-llama/Llama-2-13b-chat-hf
        - meta-llama/Llama-2-70b-chat-hf
    reason: Llama-2 model configs derive a 4096-token maximum context; vLLM rejects the default 32768 engine length for this family.
    launch:
      max_model_len: 4096

  - match:
      models:
        - meta-llama/CodeLlama-34b-Instruct-hf
    reason: CodeLlama model configs derive a 16384-token maximum context; vLLM rejects the default 32768 engine length for this family.
    launch:
      max_model_len: 16384

  - match:
      models:
        - openai/gpt-oss-120b
    reason: gpt-oss-120b should use the quantized checkpoint dtype metadata rather than forcing float16; TP1/TP2 per-experiment launch caps below avoid the H100 OOM cases documented by vLLM.
    launch:
      dtype: auto

experiments:
  # Excluded from helper_scripts/hf_cached_models.txt:
  # - <3B models: Qwen3-0.6B, Qwen3-1.7B, gemma-4-E2B-it, Llama-3.2-1B-Instruct.
  # - Qwen3-235B-A22B Instruct/Thinking, which needs at least 8 GPUs.

  - id: qwen3-4b-instruct-h100-tp1
    model: Qwen/Qwen3-4B-Instruct-2507
    workload: ./workloads/live_sharegpt_workload_context.yaml

  - id: qwen3-4b-thinking-h100-tp1
    model: Qwen/Qwen3-4B-Thinking-2507
    workload: ./workloads/live_sharegpt_workload_context.yaml

  - id: qwen3-8b-h100-tp1
