run:
  run_id: single-gpu-model-loop-run-code-workloads-000
  output_root: ../results/orchestrator
  allowed_gpu_ids: [0, 1]
  max_active_gpus: 2
  keep_one_gpu_spare: false
  default_endpoint: /v1/completions
  base_port_start: 8300
  base_port_end: 8399
  metrics_port_offset: 1000
  python_executable: /local/scratch/a/shi676/.venv/bin/python

hardware:
  name: l40-48gb
  gpu_memory_gb: 48
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768

search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 5000
  tpot_slo_ms: 50
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 256
  max_num_batched_tokens: 2048

overrides:
  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: CrossCodeEval has moderate prompts and tiny completions; small models can use a wider interactive-code search envelope.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 2
      max_request_rate: 80
      max_binary_steps: 11
      max_bracket_trials: 20
      ttft_slo_ms: 500
      tpot_slo_ms: 40
      max_closed_loop_concurrency: 256

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: CrossCodeEval p90 input is about 963 tokens and p90 output is 8 tokens; mid-size models should still target interactive completion latency.
    search:
      initial_request_rate: 1
      max_request_rate: 32
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 750
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 128

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Larger models use a lower CrossCodeEval ceiling but keep a code-completion TTFT target.
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 1500
      tpot_slo_ms: 75

  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
      workloads:
        - '*repobench*'
    reason: RepoBench aggregate has short completions but a long cross-file prompt tail; even long IDE completion prompts should not normalize double-digit-second first-token latency.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 0.5
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 5000
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 128

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*repobench*'
    reason: RepoBench p90 input is about 8.3k tokens and p95 is about 10.9k, but completions are one-line sized; keep TTFT bounded to an IDE-realistic ceiling.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 5000
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 64

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*repobench*'
    reason: Larger models get lower request-rate ceilings for RepoBench, but the latency target still reflects interactive code completion rather than summarization.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 5000
      tpot_slo_ms: 75
      max_closed_loop_concurrency: 64

experiments:
  - id: single-gpu-model-loop-code-workloads
    models:
      - Qwen/Qwen3-0.6B
      - Qwen/Qwen3-1.7B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E2B-it
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic/workload_yamls/shard_000.yaml
