name: longbench_short_answer_document_qa_original_qwen3_8b
dataset:
  name: longbench
  raw_path: ../../../data/raw/longbench
  split: test
  profile: short_answer_document_qa
  configs:
  - multifieldqa_en
  - multifieldqa_en_e
  - multifieldqa_zh
  - qasper
  - qasper_e
tokenization:
  tokenizer: Qwen/Qwen3-8B
filtering:
  min_prompt_tokens: 128
  max_prompt_tokens: 32768
  min_target_tokens: 1
  max_target_tokens: 2048
  dedup:
    content_hash: true
sampling:
  seed: 23
  policy: task_uniform
  samples_per_task: 1000000
  burst_size: 8
request:
  endpoint: /v1/completions
  temperature: 0.0
  stream: true
  ignore_eos: false
sharding:
  output_dir: longbench_short_answer_document_qa_original_qwen3_8b
  samples_per_shard: 2048
workload_yaml:
  context_policy:
    max_model_len: 32768
    tokenizer_source: vllm_model_config
    unsafe_allow_workload_tokenizer_for_real_datasets: true
    over_limit: truncate_prompt
    truncation_side: left
