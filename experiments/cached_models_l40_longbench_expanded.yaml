run:
  run_id: cached-models-l40-longbench-expanded-000
  output_root: ../results/orchestrator
  allowed_gpu_ids: [0, 1, 2, 3]
  max_active_gpus: 4
  keep_one_gpu_spare: false
  default_endpoint: /v1/completions
  base_port_start: 8600
  base_port_end: 8699
  metrics_port_offset: 1000
  python_executable: /local/scratch/a/shi676/.venv/bin/python

hardware:
  name: l40-48gb
  gpu_memory_gb: 48
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 32768
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-120b: 30.0

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 450
  trial_max_duration_s: 750
  final_confirmation_duration_s: 750
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  open_loop_bracket_growth_factor: 1.5
  metrics_interval_s: 1.0
  window_s: 50.0
  ttft_slo_ms: 15000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  ttft_slo_mode: length_scaled
  request_reuse_policy: unique-then-cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 16
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 256
  max_num_batched_tokens: 2048

overrides:
  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
    reason: Small single-GPU models can probe a wider LongBench envelope, but the expanded shards still keep request reuse bounded.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 10
      max_bracket_trials: 18

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
    reason: 3B/4B-class LongBench runs use a moderate long-prompt search envelope.
    search:
      initial_request_rate: 0.25
      max_request_rate: 6
      max_binary_steps: 9
      max_bracket_trials: 16

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
        - openai/gpt-oss-20b
    reason: 8B/14B/gpt-oss-20B LongBench runs keep a lower ceiling for prefill-heavy prompts.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14

  - match:
      model: openai/gpt-oss-20b
    reason: gpt-oss-20B uses quantized checkpoint metadata and should let vLLM pick dtype.
    launch:
      dtype: auto

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-30B-A3B-Thinking-2507
        - Qwen/Qwen3-32B
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
    reason: Local TP2/TP4 ~30B LongBench runs use a conservative 32k-context envelope on L40s.
    search:
      initial_request_rate: 0.125
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14

  - match:
      workloads:
        - '*long_output_summarization*'
    reason: Long-output summarization has the largest decode demand; keep the rate ceiling low and rely on extended trials.
    search:
      initial_request_rate: 0.125
      max_request_rate: 2
      max_closed_loop_concurrency: 16

  - match:
      workloads:
        - '*medium_output_summarization*'
    reason: Medium-output summarization still combines long prompts with hundreds-token completions.
    search:
      initial_request_rate: 0.25
      max_request_rate: 3
      max_closed_loop_concurrency: 16

  - match:
      workloads:
        - '*medium_answer_rag_qa*'
    reason: RAG-QA uses long document prompts with medium answers; the expanded shard now has enough unique source groups for longer sweeps.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_closed_loop_concurrency: 16

  - match:
      workloads:
        - '*short_answer_document_qa*'
    reason: Short-answer QA has the shortest outputs but still long inputs; use the widest LongBench bucket ceiling.
    search:
      initial_request_rate: 0.25
      max_request_rate: 6
      max_closed_loop_concurrency: 16

  - match:
      models:
        - meta-llama/Llama-3.1-70B-Instruct
        - openai/gpt-oss-120b
    reason: 70B/gpt-oss-120B local LongBench runs should not inherit short-answer bucket ceilings on L40s.
    search:
      initial_request_rate: 0.1
      max_request_rate: 2
      max_binary_steps: 8
      max_bracket_trials: 12
      max_closed_loop_concurrency: 16

  - match:
      model: openai/gpt-oss-120b
    reason: gpt-oss-120B uses quantized checkpoint metadata; local L40 runs avoid expandable-segments allocator settings because they can break TP2 custom all-reduce startup.
    launch:
      dtype: auto

experiments:
  - id: longbench-expanded-single-gpu
    models:
      - Qwen/Qwen3-0.6B
      - Qwen/Qwen3-1.7B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E2B-it
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
      - openai/gpt-oss-20b
    workloads:
      - ./workloads/longbench_long_output_summarization.yaml
      - ./workloads/longbench_medium_output_summarization.yaml
      - ./workloads/longbench_medium_answer_rag_qa.yaml
      - ./workloads/longbench_short_answer_document_qa.yaml

  - id: longbench-expanded-30b-tp2
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
    workloads:
      - ./workloads/longbench_long_output_summarization.yaml
      - ./workloads/longbench_medium_output_summarization.yaml
      - ./workloads/longbench_medium_answer_rag_qa.yaml
      - ./workloads/longbench_short_answer_document_qa.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2

  - id: longbench-expanded-30b-tp4
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
    workloads:
      - ./workloads/longbench_long_output_summarization.yaml
      - ./workloads/longbench_medium_output_summarization.yaml
      - ./workloads/longbench_medium_answer_rag_qa.yaml
      - ./workloads/longbench_short_answer_document_qa.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: longbench-expanded-70b-tp4
    model: meta-llama/Llama-3.1-70B-Instruct
    workloads:
      - ./workloads/longbench_long_output_summarization.yaml
      - ./workloads/longbench_medium_output_summarization.yaml
      - ./workloads/longbench_medium_answer_rag_qa.yaml
      - ./workloads/longbench_short_answer_document_qa.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: longbench-expanded-gpt-oss-120b-tp2
    model: openai/gpt-oss-120b
    workloads:
      - ./workloads/longbench_long_output_summarization_8k.yaml
      - ./workloads/longbench_medium_output_summarization_8k.yaml
      - ./workloads/longbench_medium_answer_rag_qa_8k.yaml
      - ./workloads/longbench_short_answer_document_qa_8k.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.85
      max_model_len: 8192
      max_num_seqs: 64
      max_num_batched_tokens: 1024

  - id: longbench-expanded-gpt-oss-120b-tp4
    model: openai/gpt-oss-120b
    workloads:
      - ./workloads/longbench_long_output_summarization.yaml
      - ./workloads/longbench_medium_output_summarization.yaml
      - ./workloads/longbench_medium_answer_rag_qa.yaml
      - ./workloads/longbench_short_answer_document_qa.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.90
      max_num_seqs: 128
      max_num_batched_tokens: 2048
