name: quality-smoke-mock-shard-000
tokenizer: character
dataset:
  type: jsonl
  path: ../shards/shard_000.runner.jsonl
sampling:
  seed: 42
  num_requests: 1
  entry_selection: sequential
  prompt_len:
    mode: from_dataset
  output_len:
    mode: natural_until_eos
    max_tokens: 32
request:
  stream: true
  temperature: 0.6
  top_p: 0.95
  ignore_eos: false
  extra_body:
    top_k: 20
    min_p: 0.0
    n: 1
