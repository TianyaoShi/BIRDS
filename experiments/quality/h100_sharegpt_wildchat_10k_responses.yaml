# Real response collection manifest for the manually judged chat-quality run.
#
# This manifest deliberately does not choose a reference model. It only collects
# one response per model/request shard so the reference baseline can be selected
# later when constructing LLM-as-a-judge comparison prompts.
#
# Model set source: helper_scripts/hf_cached_models.txt, excluding CodeLlama and
# DeepSeek-V4 checkpoints. Concurrency is floor(0.40 * the ShareGPT H100 MST
# request rate from experiments/energy/h100-sharegpt-singleturn-energy-plan.yaml).
# <3B checkpoints reuse the documented Llama-3.2-3B rate. gpt-oss-20b uses its
# documented H100 rate.
run:
  run_id: h100-quality-sharegpt-wildchat-10k-responses-000
  output_root: ../../results/quality
  default_endpoint: /v1/chat/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python

slurm:
  partition: ai
  account: yiding
  qos: normal
  time: 06:00:00
  cpus_per_gpu: 14
  modules:
    - modtree/gpu
    - cuda/12.9.0
  setup_commands:
    - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 3
  base_port: 9600

hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 1024
  max_num_batched_tokens: 8192
  readiness_timeout_s: 1200

generation:
  request_timeout_s: 21600
  concurrency_source: mst_fraction
  concurrency_mst_fraction: 0.40
  preserve_request_order: true
  response_text_max_chars: 65536
  include_prompt_text: true
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    n: 1
    max_tokens: 32768
    max_tokens_policy: model_context_minus_prompt_buffer
    prompt_token_buffer: 128
    extra_body: {}

experiments:
  - id: qwen-qwen3-0-6b-quality-responses
    model: Qwen/Qwen3-0.6B
    workloads: &quality_shards
      - ./sharegpt_wildchat_10k/workload_yamls/shard_000.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_001.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_002.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_003.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_004.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_005.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_006.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_007.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_008.yaml
      - ./sharegpt_wildchat_10k/workload_yamls/shard_009.yaml
    generation:
      concurrency_source: explicit
      max_concurrency: 21

  - id: qwen-qwen3-1-7b-quality-responses
    model: Qwen/Qwen3-1.7B
    workloads: *quality_shards
    generation:
      concurrency_source: explicit
      max_concurrency: 21

  - id: qwen-qwen3-14b-quality-responses
    model: Qwen/Qwen3-14B
    workloads: *quality_shards
    generation:
      concurrency_source: explicit
      max_concurrency: 10

  - id: qwen-qwen3-235b-a22b-instruct-2507-quality-responses
    model: Qwen/Qwen3-235B-A22B-Instruct-2507
    workloads: *quality_shards
    launch:
      gpu_count: 8
      tensor_parallel_size: 8
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "4800"
      readiness_timeout_s: 5400
    generation:
      concurrency_source: explicit
      max_concurrency: 9

  - id: qwen-qwen3-235b-a22b-thinking-2507-quality-responses
    model: Qwen/Qwen3-235B-A22B-Thinking-2507
    workloads: *quality_shards
