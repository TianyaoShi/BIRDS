# LongBench covered-task response generation for always-on reasoning models only.
# Uses expanded completion budget for final-answer quality, then score processed responses.
# Generated from h100_longbench_v1_covered_original_responses.yaml; do not submit with the old run root.
run:
  run_id: h100-quality-longbench-v1-covered-original-responses-002-thinking-only
  output_root: ../../results/quality
  default_endpoint: /v1/chat/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
slurm:
  partition: ai
  account: yiding
  qos: normal
  time: '10:00:00'
  cpus_per_gpu: 14
  modules:
  - modtree/gpu
  - cuda/12.9.0
  setup_commands:
  - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 3
  base_port: 9700
hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.9
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.2
  kv_cache_request_count: 1
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.9
  max_model_len: 32768
  max_num_seqs: 1024
  max_num_batched_tokens: 8192
  readiness_timeout_s: 1200
generation:
  request_timeout_s: 21600
  concurrency_source: mst_fraction
  concurrency_mst_fraction: 0.4
  preserve_request_order: true
  response_text_max_chars: 65536
  include_prompt_text: true
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    n: 1
    max_tokens: 32768
    max_tokens_policy: workload_expected_output_len
    prompt_token_buffer: 128
    extra_body: {}
