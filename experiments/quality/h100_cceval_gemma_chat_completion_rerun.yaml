run:
  run_id: h100-quality-cceval-original-responses-002-gemma-rerun
  output_root: ../../results/quality
  default_endpoint: /v1/chat/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
slurm:
  partition: ai
  account: yiding
  qos: normal
  time: 06:00:00
  cpus_per_gpu: 14
  modules:
  - modtree/gpu
  - cuda/12.9.0
  setup_commands:
  - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 3
  base_port: 9950
hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.9
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.2
  kv_cache_request_count: 1
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.9
  max_model_len: 32768
  max_num_seqs: 1024
  max_num_batched_tokens: 8192
  readiness_timeout_s: 1200
generation:
  request_timeout_s: 21600
  concurrency_source: explicit
  max_concurrency: 512
  preserve_request_order: true
  response_text_max_chars: 65536
  include_prompt_text: true
  load_mode: open_loop
  request_rate: 1.0
  decoding: &gemma_decoding
    temperature: 0.0
    top_p: 0.95
    top_k: 64
    min_p: 0.0
    n: 1
    max_tokens: 64
    max_tokens_policy: model_context_minus_prompt_buffer
    prompt_token_buffer: 128
    extra_body:
      repetition_penalty: 1.05
      frequency_penalty: 0.05
      seed: 1
      stop:
      - </TARGET_FILE>
      - </COMPLETION>
      - <|turn>
      - <turn|>
      - <|channel>
      - <channel|>
      - "\n\n\n"
      chat_template_kwargs:
        enable_thinking: false
experiments:
- id: google-gemma-4-26b-a4b-it-crosscodeeval-gemma-rerun
  model: google/gemma-4-26B-A4B-it
  launch:
    gpu_count: 2
    tensor_parallel_size: 2
  generation:
    concurrency_source: explicit
    max_concurrency: 512
    preserve_request_order: true
    include_prompt_text: true
    response_text_max_chars: 65536
    decoding: *gemma_decoding
    request_rate: 20.0
    load_mode: open_loop
  workloads: &gemma_workloads
  - /scratch/gautschi/shi676/BioLLM/experiments/code_workloads/crosscodeeval_rg1_unixcoder_gemma_chat_completion/workload_yamls/shard_000.yaml
  - /scratch/gautschi/shi676/BioLLM/experiments/code_workloads/crosscodeeval_rg1_unixcoder_gemma_chat_completion/workload_yamls/shard_001.yaml
  endpoint: /v1/chat/completions
