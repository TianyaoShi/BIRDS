run:
  run_id: h100-quality-longbench-v1-covered-answer-style-responses-000
  output_root: ../../results/quality
  default_endpoint: /v1/chat/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
slurm:
  partition: ai
  account: yiding
  qos: normal
  time: '10:00:00'
  cpus_per_gpu: 14
  modules:
  - modtree/gpu
  - cuda/12.9.0
  setup_commands:
  - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 3
  base_port: 9900
hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.9
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.2
  kv_cache_request_count: 1
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.9
  max_model_len: 32768
  max_num_seqs: 1024
  max_num_batched_tokens: 8192
  readiness_timeout_s: 1200
generation:
  request_timeout_s: 36000
  concurrency_source: explicit
  concurrency_mst_fraction: 0.4
  preserve_request_order: true
  response_text_max_chars: 262144
  include_prompt_text: true
  decoding:
    temperature: 0.0
    top_p: 1.0
    top_k: 20
    min_p: 0.0
    n: 1
    max_tokens: 4096
    max_tokens_policy: model_context_minus_prompt_buffer
    prompt_token_buffer: 128
    extra_body: {}
  load_mode: open_loop
  request_rate: 0.1
  max_concurrency: 128
