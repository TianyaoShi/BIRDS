run:
  run_id: a100-40gx4-longbench-no-llama2-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-longbench-no-llama2-cached-models-000
  default_endpoint: /v1/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  time: 04:00:00
  array_concurrency_limit: 3
  base_port: 9500
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 32768
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 32768
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1800
search:
  search_mode: hybrid
  trial_min_duration_s: 450
  trial_max_duration_s: 750
  final_confirmation_duration_s: 750
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  open_loop_bracket_growth_factor: 1.5
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 50.0
  ttft_slo_ms: 15000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  ttft_slo_mode: length_scaled
  request_reuse_policy: unique-then-cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 16
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048
overrides:
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
  reason: Small A100 LongBench runs keep full 32k workload context and can probe a wider envelope.
  launch:
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 0.5
    max_request_rate: 10
    max_binary_steps: 10
    max_bracket_trials: 16
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - Qwen/Qwen3-4B-Thinking-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
  reason: 3B/4B A100 LongBench runs keep full 32k workload context.
  search:
    initial_request_rate: 0.25
    max_request_rate: 6
    max_binary_steps: 9
    max_bracket_trials: 16
- match:
    models:
    - Qwen/Qwen3-8B
    - meta-llama/Llama-3.1-8B-Instruct
    - openai/gpt-oss-20b
  reason: 8B/gpt-oss-20B LongBench runs keep full 32k workload context.
  search:
    initial_request_rate: 0.25
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 14
- match:
    model: openai/gpt-oss-20b
  reason: gpt-oss-20B uses quantized checkpoint metadata.
  launch:
    dtype: auto
- match:
    models:
    - Qwen/Qwen3-14B
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-30B-A3B-Thinking-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
    - openai/gpt-oss-120b
  reason: Large A100-40GB LongBench runs use 8k workload and engine context for memory headroom.
  launch:
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
- match:
    model: openai/gpt-oss-120b
  reason: gpt-oss-120B uses quantized checkpoint metadata and is limited to TP4 at 8k context.
  launch:
    dtype: auto
    gpu_memory_utilization: 0.88
- match:
    workloads:
    - '*long_output_summarization*'
  reason: Long-output summarization has the largest decode demand.
  search:
    initial_request_rate: 0.25
    max_request_rate: 5
    max_closed_loop_concurrency: 16
- match:
    workloads:
    - '*medium_output_summarization*'
  reason: Medium-output summarization combines long prompts with hundreds-token completions.
  search:
    initial_request_rate: 0.25
    max_request_rate: 8
    max_closed_loop_concurrency: 24
- match:
    workloads:
    - '*medium_answer_rag_qa*'
  reason: RAG-QA uses long document prompts with medium answers.
  search:
    initial_request_rate: 0.25
    max_request_rate: 8
    max_closed_loop_concurrency: 24
- match:
    workloads:
    - '*short_answer_document_qa*'
  reason: Short-answer QA has the shortest outputs while retaining long inputs.
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_closed_loop_concurrency: 24
experiments:
- id: longbench-full-single-gpu
  models:
  - Qwen/Qwen3-0.6B
  - Qwen/Qwen3-1.7B
  - google/gemma-4-E2B-it
  - meta-llama/Llama-3.2-1B-Instruct
  - Qwen/Qwen3-4B-Instruct-2507
  - Qwen/Qwen3-4B-Thinking-2507
  - google/gemma-4-E4B-it
  - meta-llama/Llama-3.2-3B-Instruct
  - Qwen/Qwen3-8B
  - meta-llama/Llama-3.1-8B-Instruct
  - openai/gpt-oss-20b
  workloads:
  - ./workloads/longbench_long_output_summarization.yaml
  - ./workloads/longbench_medium_output_summarization.yaml
  - ./workloads/longbench_medium_answer_rag_qa.yaml
  - ./workloads/longbench_short_answer_document_qa.yaml
- id: longbench-qwen14-8k-tp1
  model: Qwen/Qwen3-14B
  workloads:
  - ./workloads/longbench_long_output_summarization_8k.yaml
  - ./workloads/longbench_medium_output_summarization_8k.yaml
  - ./workloads/longbench_medium_answer_rag_qa_8k.yaml
  - ./workloads/longbench_short_answer_document_qa_8k.yaml
  launch:
    max_model_len: 8192
- id: longbench-30b-8k-tp2
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/longbench_long_output_summarization_8k.yaml
  - ./workloads/longbench_medium_output_summarization_8k.yaml
  - ./workloads/longbench_medium_answer_rag_qa_8k.yaml
  - ./workloads/longbench_short_answer_document_qa_8k.yaml
  launch:
    gpu_count: 2
    tensor_parallel_size: 2
    max_model_len: 8192
- id: longbench-30b-8k-tp4
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/longbench_long_output_summarization_8k.yaml
  - ./workloads/longbench_medium_output_summarization_8k.yaml
  - ./workloads/longbench_medium_answer_rag_qa_8k.yaml
  - ./workloads/longbench_short_answer_document_qa_8k.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
    max_model_len: 8192
- id: longbench-gpt-oss-120b-8k-tp4
  model: openai/gpt-oss-120b
  workloads:
  - ./workloads/longbench_long_output_summarization_8k.yaml
  - ./workloads/longbench_medium_output_summarization_8k.yaml
  - ./workloads/longbench_medium_answer_rag_qa_8k.yaml
  - ./workloads/longbench_short_answer_document_qa_8k.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
