name: hard_reasoning_small_mixed

dataset:
  name: gpqa
  raw_path: ../../data/raw/reasoning/hard_reasoning_small_mixed.jsonl
  split: mixed
  task: hard_reasoning_small_mixed
  prompt_template: reasoning_auto

tokenization:
  tokenizer: whitespace

filtering:
  min_prompt_tokens: 8
  max_prompt_tokens: 4096
  min_target_tokens: 1
  max_target_tokens: 64
  dedup:
    content_hash: false

sampling:
  seed: 31
  burst_size: 1

request:
  endpoint: /v1/completions
  temperature: 0.0
  stream: true
  ignore_eos: false

sharding:
  output_dir: hard_reasoning_small_mixed
  samples_per_shard: 2048

workload_yaml:
  output_len:
    mode: natural_until_eos
    max_tokens: 8192
  context_policy:
    max_model_len: 32768
    tokenizer_source: vllm_model_config
    over_limit: fail
