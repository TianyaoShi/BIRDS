run:
  run_id: a100-40gx4-reasoning-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-reasoning-cached-models-000
  default_endpoint: /v1/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  time: 04:00:00
  array_concurrency_limit: 3
  base_port: 9700
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 8192
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1800
search:
  search_mode: hybrid
  trial_min_duration_s: 360
  trial_max_duration_s: 720
  final_confirmation_duration_s: 900
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 8
  max_binary_steps: 9
  max_bracket_trials: 16
  open_loop_bracket_growth_factor: 1.5
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 30.0
  ttft_slo_ms: 2000
  tpot_slo_ms: 200
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: unique-then-cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048
overrides:
- match:
    models:
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-1.7B
    - google/gemma-4-E2B-it
    - meta-llama/Llama-3.2-1B-Instruct
  reason: Small A100 reasoning models can use a wide request-rate envelope while keeping bounded concurrency for long generations.
  launch:
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 0.5
    max_request_rate: 16
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 1500
    tpot_slo_ms: 150
    max_closed_loop_concurrency: 96
- match:
    models:
    - Qwen/Qwen3-4B-Instruct-2507
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.2-3B-Instruct
  reason: 3B/4B non-thinking reasoning runs have short prompts and can probe above L40 rates on A100.
  search:
    initial_request_rate: 0.5
    max_request_rate: 12
    max_binary_steps: 10
    max_bracket_trials: 16
    ttft_slo_ms: 1500
    tpot_slo_ms: 150
    max_closed_loop_concurrency: 64
- match:
    model: Qwen/Qwen3-4B-Thinking-2507
  reason: 4B thinking models can emit longer traces than instruct variants.
  search:
    initial_request_rate: 0.25
    max_request_rate: 10
    max_binary_steps: 9
    max_bracket_trials: 14
    ttft_slo_ms: 1500
    tpot_slo_ms: 175
    max_closed_loop_concurrency: 48
- match:
    models:
    - Qwen/Qwen3-8B
    - Qwen/Qwen3-14B
    - meta-llama/Llama-3.1-8B-Instruct
    - openai/gpt-oss-20b
  reason: 8B/14B/gpt-oss-20B reasoning runs use short prompts but potentially long outputs.
  search:
    initial_request_rate: 0.25
    max_request_rate: 10
    max_binary_steps: 9
    max_bracket_trials: 14
    max_closed_loop_concurrency: 48
- match:
    model: openai/gpt-oss-20b
  reason: gpt-oss-20B uses quantized checkpoint metadata; let vLLM pick dtype.
  launch:
    dtype: auto
- match:
    models:
    - Qwen/Qwen3-30B-A3B-Instruct-2507
    - Qwen/Qwen3-32B
    - google/gemma-4-26B-A4B-it
    - google/gemma-4-31B-it
    - meta-llama/CodeLlama-34b-Instruct-hf
  reason: A100 30B-class reasoning models use TP2/TP4 with conservative decode-heavy ceilings.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.125
    max_request_rate: 6
    max_binary_steps: 8
    max_bracket_trials: 12
    max_closed_loop_concurrency: 32
- match:
    model: Qwen/Qwen3-30B-A3B-Thinking-2507
  reason: 30B thinking reasoning runs may produce the longest outputs in this size class.
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.125
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 12
    max_closed_loop_concurrency: 24
- match:
    model: openai/gpt-oss-120b
  reason: gpt-oss-120B is limited to TP4 on A100-40GB with conservative batching.
  launch:
    dtype: auto
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.1
    max_request_rate: 4
    max_binary_steps: 8
    max_bracket_trials: 12
    max_closed_loop_concurrency: 24
experiments:
- id: reasoning-single-gpu
  models:
  - Qwen/Qwen3-0.6B
  - Qwen/Qwen3-1.7B
  - Qwen/Qwen3-14B
  - Qwen/Qwen3-4B-Instruct-2507
  - Qwen/Qwen3-4B-Thinking-2507
  - Qwen/Qwen3-8B
  - google/gemma-4-E2B-it
  - google/gemma-4-E4B-it
  - meta-llama/Llama-3.1-8B-Instruct
  - meta-llama/Llama-3.2-1B-Instruct
  - meta-llama/Llama-3.2-3B-Instruct
  - openai/gpt-oss-20b
  workloads:
  - ./workloads/a100_mmlu_pro_reasoning_8k.yaml
  - ./workloads/a100_supergpqa_hard_reasoning_8k.yaml
- id: reasoning-30b-tp2
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/a100_mmlu_pro_reasoning_8k.yaml
  - ./workloads/a100_supergpqa_hard_reasoning_8k.yaml
  launch:
    gpu_count: 2
    tensor_parallel_size: 2
- id: reasoning-30b-tp4
  models:
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - Qwen/Qwen3-30B-A3B-Thinking-2507
  - Qwen/Qwen3-32B
  - google/gemma-4-26B-A4B-it
  - google/gemma-4-31B-it
  - meta-llama/CodeLlama-34b-Instruct-hf
  workloads:
  - ./workloads/a100_mmlu_pro_reasoning_8k.yaml
  - ./workloads/a100_supergpqa_hard_reasoning_8k.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
- id: reasoning-gpt-oss-120b-tp4
  model: openai/gpt-oss-120b
  workloads:
  - ./workloads/a100_mmlu_pro_reasoning_8k.yaml
  - ./workloads/a100_supergpqa_hard_reasoning_8k.yaml
  launch:
    gpu_count: 4
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.88
    max_model_len: 8192
    max_num_seqs: 128
    max_num_batched_tokens: 2048
