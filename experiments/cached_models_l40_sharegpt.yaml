run:
  run_id: cached-models-l40-sharegpt-000
  output_root: ../results/orchestrator
  allowed_gpu_ids: [0, 1, 2, 3]
  max_active_gpus: 4
  keep_one_gpu_spare: false
  default_endpoint: /v1/chat/completions
  base_port_start: 8600
  base_port_end: 8699
  metrics_port_offset: 1000
  python_executable: /local/scratch/a/shi676/.venv/bin/python

hardware:
  name: l40-48gb
  gpu_memory_gb: 48
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 4096
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-120b: 30.0

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 150
  trial_max_duration_s: 270
  final_confirmation_duration_s: 270
  rate_precision: 0.10
  initial_request_rate: 1
  max_request_rate: 12
  max_binary_steps: 8
  max_bracket_trials: 14
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 1000
  tpot_slo_ms: 150
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: unique-then-cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 128
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 256
  max_num_batched_tokens: 2048

overrides:
  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
    reason: Single-GPU small chat models can use a wider ShareGPT request-rate envelope.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 2
      max_request_rate: 64
      max_binary_steps: 11
      max_bracket_trials: 20
      ttft_slo_ms: 250
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 256

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
    reason: Single-GPU 3B/4B chat models keep a moderate ShareGPT search envelope.
    search:
      initial_request_rate: 1
      max_request_rate: 24
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 500
      tpot_slo_ms: 100

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-2-7b-chat-hf
        - meta-llama/Llama-2-13b-chat-hf
        - meta-llama/Llama-3.1-8B-Instruct
    reason: Single-GPU 7B/8B/13B/14B chat runs should start conservatively but keep enough ceiling for L40 saturation.
    search:
      initial_request_rate: 0.5
      max_request_rate: 8
      max_binary_steps: 7
      max_bracket_trials: 12

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-30B-A3B-Thinking-2507
        - Qwen/Qwen3-32B
        - google/gemma-4-26B-A4B-it
        - google/gemma-4-31B-it
        - meta-llama/CodeLlama-34b-Instruct-hf
    reason: 30B-class ShareGPT sweeps on L40 are multi-GPU runs with lower expected request-rate ceilings.
    search:
      initial_request_rate: 0.25
      max_request_rate: 6
      max_binary_steps: 8
      max_bracket_trials: 12

  - match:
      models:
        - meta-llama/Llama-2-70b-chat-hf
        - meta-llama/Llama-3.1-70B-Instruct
        - openai/gpt-oss-120b
    reason: 70B/gpt-oss-120B ShareGPT runs need conservative multi-GPU bracketing on local L40 nodes.
    search:
      initial_request_rate: 0.1
      max_request_rate: 3
      max_binary_steps: 8
      max_bracket_trials: 12
      max_closed_loop_concurrency: 64

  - match:
      models:
        - meta-llama/Llama-2-7b-chat-hf
        - meta-llama/Llama-2-13b-chat-hf
        - meta-llama/Llama-2-70b-chat-hf
    reason: Llama 2 context length is 4096 tokens; keep launch and workload validation aligned.
    launch:
      max_model_len: 4096

  - match:
      models:
        - meta-llama/CodeLlama-34b-Instruct-hf
    reason: CodeLlama model configs derive a 16384-token maximum context; vLLM rejects the default 32768 engine length for this family.
    launch:
      max_model_len: 16384

  - match:
      models:
        - openai/gpt-oss-20b
        - openai/gpt-oss-120b
    reason: gpt-oss checkpoints should let vLLM select dtype from checkpoint metadata.
    launch:
      dtype: auto
      env:
        PYTORCH_ALLOC_CONF: expandable_segments:True
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  - match:
      model: openai/gpt-oss-20b
    reason: gpt-oss-20B ShareGPT throughput is closer to mid-size models than dense 20B fp16 models.
    search:
      initial_request_rate: 4
      max_request_rate: 36
      max_binary_steps: 11
      max_bracket_trials: 16

experiments:
  - id: sharegpt-single-gpu
    models:
      - Qwen/Qwen3-0.6B
      - Qwen/Qwen3-1.7B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E2B-it
      - google/gemma-4-E4B-it
      - meta-llama/Llama-2-7b-chat-hf
      - meta-llama/Llama-2-13b-chat-hf
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
      - openai/gpt-oss-20b
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml

  - id: sharegpt-30b-tp2
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2

  - id: sharegpt-30b-tp4
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: sharegpt-70b-tp4
    models:
      - meta-llama/Llama-2-70b-chat-hf
      - meta-llama/Llama-3.1-70B-Instruct
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: sharegpt-gpt-oss-120b-tp2
    model: openai/gpt-oss-120b
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.9
      max_model_len: 16384
      max_num_seqs: 128
      max_num_batched_tokens: 1024

  - id: sharegpt-gpt-oss-120b-tp4
    model: openai/gpt-oss-120b
    workloads:
      - ./workloads/live_sharegpt_workload_context.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.90
      max_num_seqs: 128
      max_num_batched_tokens: 2048
