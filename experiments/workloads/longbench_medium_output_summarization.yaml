name: longbench_medium_output_summarization
dataset:
  type: jsonl
  path: ../longbench_workloads/materialization/longbench_medium_output_summarization_qwen3_8b/shards/shard_000.runner.jsonl
tokenizer: whitespace
sampling:
  seed: 42
  num_requests: 2048
  entry_selection: sequential
  prompt_len:
    mode: from_dataset
  output_len:
    mode: from_dataset
request:
  stream: true
  temperature: 0.0
  ignore_eos: false
context_policy:
  max_model_len: 32768
  tokenizer_source: workload_tokenizer
  unsafe_allow_workload_tokenizer_for_real_datasets: true
  over_limit: truncate_prompt
  truncation_side: left
