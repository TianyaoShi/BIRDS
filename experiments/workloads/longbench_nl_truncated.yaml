name: longbench-nl-truncated
dataset:
  type: longbench
  path: THUDM/LongBench
  configs:
    - narrativeqa
    - qasper
    - multifieldqa_en
    - multifieldqa_zh
    - hotpotqa
    - 2wikimqa
    - musique
    - dureader
    - gov_report
    - qmsum
    - multi_news
    - vcsum
    - trec
    - triviaqa
    - samsum
    - lsht
    - passage_count
    - passage_retrieval_en
    - passage_retrieval_zh
    - qasper_e
    - multifieldqa_en_e
    - hotpotqa_e
    - 2wikimqa_e
    - gov_report_e
    - multi_news_e
    - trec_e
    - triviaqa_e
    - samsum_e
    - passage_count_e
    - passage_retrieval_en_e
sampling:
  seed: 23
  num_requests: 3000
  prompt_len:
    mode: from_dataset
  output_len:
    mode: from_dataset
request:
  stream: true
  temperature: 0.0
  ignore_eos: false
context_policy:
  max_model_len: 32768
  tokenizer_source: vllm_model_config
  over_limit: truncate_prompt
  truncation_side: left
