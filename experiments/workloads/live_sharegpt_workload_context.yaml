name: live_sharegpt_workload_context

dataset:
  type: sharegpt
  path: /scratch/gautschi/shi676/datasets/shareGPT/ShareGPT_V3_unfiltered_cleaned_split_no_imsorry.json

sampling:
  seed: 42
  num_requests: 5000
  prompt_len:
    mode: from_dataset
  output_len:
    mode: from_dataset

request:
  temperature: 0.0
  ignore_eos: true
  stream: true

context_policy:
  max_model_len: 32768
  over_limit: skip_sample
  truncation_side: left
