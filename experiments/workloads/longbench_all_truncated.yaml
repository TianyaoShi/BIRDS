name: longbench-all-truncated
dataset:
  type: longbench
  path: THUDM/LongBench
sampling:
  seed: 23
  num_requests: 3000
  prompt_len:
    mode: from_dataset
  output_len:
    mode: from_dataset
request:
  stream: true
  temperature: 0.0
  ignore_eos: false
context_policy:
  max_model_len: 32768
  tokenizer_source: vllm_model_config
  over_limit: truncate_prompt
  truncation_side: left
