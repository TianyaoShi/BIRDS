run:
  run_id: cached-models-l40-code-workloads-000
  output_root: ../results/orchestrator
  allowed_gpu_ids: [0, 1, 2, 3]
  max_active_gpus: 4
  keep_one_gpu_spare: false
  default_endpoint: /v1/completions
  base_port_start: 8400
  base_port_end: 8499
  metrics_port_offset: 1000
  python_executable: /local/scratch/a/shi676/.venv/bin/python

hardware:
  name: l40-48gb
  gpu_memory_gb: 48
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-120b: 30.0

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 5000
  tpot_slo_ms: 75
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048

overrides:
  - match:
      workloads:
        - '*crosscodeeval*'
    reason: CrossCodeEval has moderate prompts and tiny completions; keep an interactive code-completion TTFT target.
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 9
      max_bracket_trials: 14
      ttft_slo_ms: 1500
      tpot_slo_ms: 75

  - match:
      workloads:
        - '*repobench*'
    reason: RepoBench 8k-drop has long retrieved-code prompts but one-line completions; keep TTFT bounded to the slow end of IDE completion latency.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 5000
      tpot_slo_ms: 75

  - match:
      models:
        - meta-llama/Llama-3.1-70B-Instruct
        - openai/gpt-oss-120b
      workloads:
        - '*crosscodeeval*'
    reason: 70B/gpt-oss-120B local multi-GPU sweeps should start below the 30B-class code-completion envelope.
    search:
      initial_request_rate: 0.25
      max_request_rate: 6
      max_binary_steps: 8
      max_bracket_trials: 12

  - match:
      models:
        - meta-llama/Llama-3.1-70B-Instruct
        - openai/gpt-oss-120b
      workloads:
        - '*repobench*'
    reason: RepoBench combines long prompts with large models; keep the upper bound conservative to avoid cache-distorted high-rate searches.
    search:
      initial_request_rate: 0.1
      max_request_rate: 2
      max_binary_steps: 8
      max_bracket_trials: 12

  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Single-GPU small models can use a wider CrossCodeEval request-rate envelope.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 2
      max_request_rate: 80
      max_binary_steps: 11
      max_bracket_trials: 20
      ttft_slo_ms: 500
      tpot_slo_ms: 40
      max_closed_loop_concurrency: 256

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Single-GPU 3B/4B models should still target interactive CrossCodeEval latency.
    search:
      initial_request_rate: 1
      max_request_rate: 32
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 750
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 128

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Single-GPU 8B/14B models use a lower CrossCodeEval ceiling but keep a code-completion TTFT target.
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 1500
      tpot_slo_ms: 75

  - match:
      models:
        - Qwen/Qwen3-0.6B
        - Qwen/Qwen3-1.7B
        - google/gemma-4-E2B-it
        - meta-llama/Llama-3.2-1B-Instruct
      workloads:
        - '*repobench*'
    reason: Single-GPU small models can probe a wider RepoBench 8k-drop envelope while keeping IDE-like TTFT.
    launch:
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
    search:
      initial_request_rate: 0.5
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 5000
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 128

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*repobench*'
    reason: Single-GPU 3B/4B RepoBench runs keep the same IDE-realistic latency envelope as the earlier single-GPU manifest.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 5000
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 64

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*repobench*'
    reason: Single-GPU 8B/14B RepoBench runs get lower ceilings while preserving the code-completion latency target.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 5000
      tpot_slo_ms: 75
      max_closed_loop_concurrency: 64

experiments:
  - id: code-workloads-single-gpu
    models:
      - Qwen/Qwen3-0.6B
      - Qwen/Qwen3-1.7B
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E2B-it
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml

  - id: code-workloads-30b-tp2
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2

  - id: code-workloads-30b-tp4
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: code-workloads-70b-tp4
    model: meta-llama/Llama-3.1-70B-Instruct
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4