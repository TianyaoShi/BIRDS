run:
  run_id: a100-40gx4-code-targeted-rerun-002
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/a100-40gx4-code-targeted-rerun-002
  default_endpoint: /v1/completions
  python_executable: .venv-a100/bin/python
slurm:
  partition: gpu
  account: cis250584-gpu
  modules:
  - modtree/gpu
  - gcc/11.2.0
  - cuda/12.8.0
  setup_commands:
  - source helper_scripts/activate_vllm_a100.sh
  python_executable: .venv-a100/bin/python
  cpus_per_gpu: 16
  time: '10:00:00'
  array_concurrency_limit: 2
  base_port: 9700
hardware:
  name: a100-40gb
  gpu_memory_gb: 40
  gpu_memory_utilization: 0.88
probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 32768
  activation_memory_gb: 2.0
  memory_safety_factor: 1.25
  kv_cache_request_count: 1
  model_size_overrides_b:
    openai/gpt-oss-20b: 5.0
    openai/gpt-oss-120b: 30.0
launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.88
  max_model_len: 32768
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1800
search:
  search_mode: open-loop
  trial_min_duration_s: 300
  trial_max_duration_s: 600
  final_confirmation_duration_s: 900
  rate_precision: 0.025
  initial_request_rate: 0.5
  max_request_rate: 4
  max_binary_steps: 14
  max_bracket_trials: 24
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: cycle
  closed_loop_min_trials: 3
  closed_loop_plateau_relative_gain: 0.05
experiments:
- id: code-targeted-qwen06-crosscodeeval
  model: Qwen/Qwen3-0.6B
  workloads:
  - ./workloads/a100_crosscodeeval_rg1_unixcoder_cache_realistic_shards_000_001.yaml
  launch:
    max_num_seqs: 256
    max_num_batched_tokens: 4096
  search:
    initial_request_rate: 56
    max_request_rate: 128
    max_binary_steps: 14
    max_bracket_trials: 24
    ttft_slo_ms: 500
    tpot_slo_ms: 40
    max_closed_loop_concurrency: 192
- id: code-targeted-gemma-e4b-repobench
  model: google/gemma-4-E4B-it
  workloads:
  - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
  launch:
    max_num_seqs: 128
    max_num_batched_tokens: 2048
  search:
    initial_request_rate: 0.5
    max_request_rate: 4
    max_binary_steps: 14
    max_bracket_trials: 24
    ttft_slo_ms: 5000
    tpot_slo_ms: 50
