run:
  run_id: h100-code-workloads-cached-models-000
  output_root: ../results/orchestrator
  mst_output_root: ../results/mst/h100-code-workloads-cached-models-000
  default_endpoint: /v1/completions
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python

slurm:
  partition: ai
  account: yiding
  qos: normal
  time: 06:00:00
  modules:
    - modtree/gpu
    - cuda/12.9.0
  setup_commands:
    - source /scratch/gautschi/shi676/BioLLM/helper_scripts/activate_vllm_h100.sh
  python_executable: /scratch/gautschi/shi676/BioLLM/.venv-h100/bin/python
  array_concurrency_limit: 2
  base_port: 9600

hardware:
  name: h100-80gb
  gpu_memory_gb: 80
  gpu_memory_utilization: 0.90

probe:
  enabled: true
  auto_gpu_count: false
  default_context_tokens: 8192
  activation_memory_gb: 2.0
  memory_safety_factor: 1.20
  kv_cache_request_count: 1

launch:
  executable: vllm
  tensor_parallel_size: 1
  gpu_count: 1
  dtype: float16
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  readiness_timeout_s: 1200

search:
  search_mode: hybrid
  trial_min_duration_s: 180
  trial_max_duration_s: 360
  final_confirmation_duration_s: 360
  rate_precision: 0.05
  initial_request_rate: 0.25
  max_request_rate: 4
  max_binary_steps: 8
  max_bracket_trials: 14
  client_limited_retry_attempts: 1
  client_limited_retry_cooldown_s: 30
  metrics_interval_s: 1.0
  window_s: 10.0
  ttft_slo_ms: 5000
  tpot_slo_ms: 75
  ttft_slo_field: ttft_p90_ms
  tpot_slo_field: tpot_p90_ms
  request_reuse_policy: cycle
  closed_loop_min_trials: 3
  max_closed_loop_concurrency: 64
  closed_loop_plateau_relative_gain: 0.05
  max_num_seqs: 128
  max_num_batched_tokens: 2048

overrides:
  - match:
      workloads:
        - '*crosscodeeval*'
    reason: CrossCodeEval has moderate prompts and tiny completions; keep an interactive code-completion TTFT target.
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 9
      max_bracket_trials: 14
      ttft_slo_ms: 1500
      tpot_slo_ms: 75

  - match:
      workloads:
        - '*repobench*'
    reason: RepoBench 8k-drop has long retrieved-code prompts but one-line completions; keep TTFT bounded to the slow end of IDE completion latency.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 5000
      tpot_slo_ms: 75

  - match:
      models:
        - meta-llama/Llama-3.1-70B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: 70B H100 multi-GPU sweeps should start below the 30B-class code-completion envelope.
    search:
      initial_request_rate: 0.25
      max_request_rate: 6
      max_binary_steps: 8
      max_bracket_trials: 12

  - match:
      models:
        - meta-llama/Llama-3.1-70B-Instruct
      workloads:
        - '*repobench*'
    reason: RepoBench combines long prompts with large models; keep the upper bound conservative to avoid cache-distorted high-rate searches.
    search:
      initial_request_rate: 0.1
      max_request_rate: 2
      max_binary_steps: 8
      max_bracket_trials: 12

  - match:
      models:
        - Qwen/Qwen3-235B-A22B-Instruct-2507
        - Qwen/Qwen3-235B-A22B-Thinking-2507
      workloads:
        - '*crosscodeeval*'
    reason: Qwen3-235B-A22B is sparse MoE with about 22B active parameters; TP8 CrossCodeEval should probe above dense-large caps.
    launch:
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      readiness_timeout_s: 2400
    search:
      initial_request_rate: 0.25
      max_request_rate: 16
      max_binary_steps: 10
      max_bracket_trials: 16

  - match:
      models:
        - Qwen/Qwen3-235B-A22B-Instruct-2507
        - Qwen/Qwen3-235B-A22B-Thinking-2507
      workloads:
        - '*repobench*'
    reason: Qwen3-235B-A22B is sparse MoE; RepoBench has long prompts, but TP8 should still get more headroom than dense large models.
    launch:
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      readiness_timeout_s: 2400
    search:
      initial_request_rate: 0.1
      max_request_rate: 4
      max_binary_steps: 9
      max_bracket_trials: 16

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Single-GPU 3B/4B models should still target interactive CrossCodeEval latency.
    search:
      initial_request_rate: 1
      max_request_rate: 32
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 750
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 128

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*crosscodeeval*'
    reason: Single-GPU 8B/14B models use a lower CrossCodeEval ceiling but keep a code-completion TTFT target.
    search:
      initial_request_rate: 0.5
      max_request_rate: 12
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 1500
      tpot_slo_ms: 75

  - match:
      models:
        - Qwen/Qwen3-4B-Instruct-2507
        - Qwen/Qwen3-4B-Thinking-2507
        - google/gemma-4-E4B-it
        - meta-llama/Llama-3.2-3B-Instruct
      workloads:
        - '*repobench*'
    reason: Single-GPU 3B/4B RepoBench runs keep the same IDE-realistic latency envelope as the earlier single-GPU manifest.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 5000
      tpot_slo_ms: 50
      max_closed_loop_concurrency: 64

  - match:
      models:
        - Qwen/Qwen3-8B
        - Qwen/Qwen3-14B
        - meta-llama/Llama-3.1-8B-Instruct
      workloads:
        - '*repobench*'
    reason: Single-GPU 8B/14B RepoBench runs get lower ceilings while preserving the code-completion latency target.
    search:
      initial_request_rate: 0.25
      max_request_rate: 4
      max_binary_steps: 8
      max_bracket_trials: 14
      ttft_slo_ms: 5000
      tpot_slo_ms: 75
      max_closed_loop_concurrency: 64

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-30B-A3B-Thinking-2507
        - google/gemma-4-26B-A4B-it
      workloads:
        - '*crosscodeeval*'
    reason: Sparse 30B-class MoE models activate only a small expert subset per token; give them more H100 search headroom than dense 30B models.
    search:
      initial_request_rate: 0.5
      max_request_rate: 24
      max_binary_steps: 10
      max_bracket_trials: 18
      ttft_slo_ms: 1500
      tpot_slo_ms: 75
      max_closed_loop_concurrency: 96

  - match:
      models:
        - Qwen/Qwen3-30B-A3B-Instruct-2507
        - Qwen/Qwen3-30B-A3B-Thinking-2507
        - google/gemma-4-26B-A4B-it
      workloads:
        - '*repobench*'
    reason: Sparse 30B-class MoE models should not inherit the dense-model RepoBench cap.
    search:
      initial_request_rate: 0.25
      max_request_rate: 8
      max_binary_steps: 9
      max_bracket_trials: 16
      ttft_slo_ms: 5000
      tpot_slo_ms: 75
      max_closed_loop_concurrency: 96

experiments:
  - id: code-workloads-single-gpu
    models:
      - Qwen/Qwen3-14B
      - Qwen/Qwen3-4B-Instruct-2507
      - Qwen/Qwen3-4B-Thinking-2507
      - Qwen/Qwen3-8B
      - google/gemma-4-E4B-it
      - meta-llama/Llama-3.1-8B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml

  - id: code-workloads-30b-tp2
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 2
      tensor_parallel_size: 2

  - id: code-workloads-30b-tp4
    models:
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - Qwen/Qwen3-30B-A3B-Thinking-2507
      - Qwen/Qwen3-32B
      - google/gemma-4-26B-A4B-it
      - google/gemma-4-31B-it
      - meta-llama/CodeLlama-34b-Instruct-hf
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: code-workloads-70b-tp4
    model: meta-llama/Llama-3.1-70B-Instruct
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 4
      tensor_parallel_size: 4

  - id: code-workloads-qwen3-235b-a22b-tp8
    models:
      - Qwen/Qwen3-235B-A22B-Instruct-2507
      - Qwen/Qwen3-235B-A22B-Thinking-2507
    workloads:
      - ./code_workloads/crosscodeeval_rg1_unixcoder_cache_realistic/workload_yamls/shard_000.yaml
      - ./code_workloads/repobench_python_java_aggregate_cache_realistic_8k_drop/workload_yamls/shard_000.yaml
    launch:
      gpu_count: 8
      tensor_parallel_size: 8
