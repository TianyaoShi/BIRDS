# MST Analyzer settings template.
# Prefer the defaults unless you are intentionally calibrating analyzer behavior.
# Trace-only findings are reported as diagnostics by default, not anomalies.

outlier_bands:
  - min_rate: 10.0
    max_rate: null
    ratio_threshold: 1.5
    absolute_delta_rps: 5.0
  - min_rate: 2.0
    max_rate: 10.0
    ratio_threshold: 1.5
    absolute_delta_rps: 1.0
  - min_rate: 0.0
    max_rate: 2.0
    ratio_threshold: 2.5
    absolute_delta_rps: 1.0

larger_model_min_size_ratio: 1.5
larger_model_min_close_relative_rate: 0.85
larger_model_max_relative_rate: 1.15
larger_model_max_underperform_relative_rate: 0.75
larger_model_min_rate_for_relative_compare: 2.0
larger_model_min_absolute_delta_rps: 1.0

same_family_max_relative_rate: 0.8
same_family_min_rate: 2.0

trace_instability_min_uncertain_retries: 2
trace_instability_require_low_confidence_uncertain_retries: 1
include_trace_only_findings: false

suppressions:
  disable_families: []
  suppress_trace_instability_below_rps: null
  suppress_contextual_only_findings: false
  suppress_quantized_bucket_verdicts: true
  suppress_moe_bucket_verdicts: true
